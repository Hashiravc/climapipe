peru_weather_profile:
  target: dev
  outputs:
    dev:
      type: postgres
      host: "{{ env_var('DB_HOST', 'localhost') }}"
      user: "{{ env_var('DB_USER', 'neondb_owner') }}"
      password: "{{ env_var('DB_PASSWORD', '') }}"
      port: "{{ env_var('DB_PORT', '5432') | int }}"
      dbname: "{{ env_var('DB_NAME', 'neondb') }}"
      schema: public
      threads: 4
      keepalives_idle: 0
      connect_timeout: 15
      sslmode: "{{ env_var('DB_SSLMODE', 'require') }}"
    prod:
      type: postgres
      host: "{{ env_var('DB_HOST', 'localhost') }}"
      user: "{{ env_var('DB_USER', 'neondb_owner') }}"
      password: "{{ env_var('DB_PASSWORD', '') }}"
      port: "{{ env_var('DB_PORT', '5432') | int }}"
      dbname: "{{ env_var('DB_NAME', 'neondb') }}"
      schema: public
      threads: 4
      keepalives_idle: 0
      connect_timeout: 15
      sslmode: "{{ env_var('DB_SSLMODE', 'require') }}"
