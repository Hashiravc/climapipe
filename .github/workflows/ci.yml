name: CI - Integración Continua

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  test-and-validate:
    name: Pruebas Unitarias y Validación dbt
    runs-on: ubuntu-latest

    steps:
      - name: Descargar código fuente
        uses: actions/checkout@v4

      - name: Configurar entorno Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Ejecutar pruebas unitarias y de integración (pytest)
        run: |
          pytest -v --tb=short

      - name: Validar sintaxis y compilación de dbt Core
        run: |
          dbt parse --project-dir dbt_project --profiles-dir dbt_project

      - name: Verificar estructura de archivos requeridos
        run: |
          python -c "
          import os
          required_files = [
              'src/config.py',
              'src/extractor/open_meteo.py',
              'src/loader/postgres_loader.py',
              'scripts/run_pipeline.py',
              'app/main.py',
              'dbt_project/dbt_project.yml',
              'dbt_project/profiles.yml',
              'requirements.txt',
              '.env.example',
              'README.md'
          ]
          missing = [f for f in required_files if not os.path.exists(f)]
          if missing:
              raise FileNotFoundError(f'Archivos faltantes en el repositorio: {missing}')
          print('✅ Todos los archivos críticos del proyecto están presentes.')
          "
