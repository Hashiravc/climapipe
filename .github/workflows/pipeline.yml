name: Pipeline ELT Automatizado

on:
  schedule:
    # Ejecución programada diaria a las 06:00 AM hora de Lima (11:00 UTC)
    - cron: '0 11 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Modo de ejecución del pipeline'
        required: true
        default: 'incremental'
        type: choice
        options:
          - incremental
          - initial
      skip_dbt:
        description: 'Omitir ejecución de dbt build'
        required: false
        default: false
        type: boolean

jobs:
  run-elt-pipeline:
    name: Extracción, Carga en Neon y Transformación dbt
    runs-on: ubuntu-latest

    env:
      NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
      DB_HOST: ${{ secrets.DB_HOST }}
      DB_PORT: ${{ secrets.DB_PORT || '5432' }}
      DB_NAME: ${{ secrets.DB_NAME || 'neondb' }}
      DB_USER: ${{ secrets.DB_USER }}
      DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
      DB_SSLMODE: ${{ secrets.DB_SSLMODE || 'require' }}
      OPEN_METEO_BASE_URL: https://archive-api.open-meteo.com/v1/archive
      LOG_LEVEL: INFO

    steps:
      - name: Descargar código fuente
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Instalar dependencias del pipeline
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verificar secretos de base de datos
        run: |
          if [ -z "$NEON_DATABASE_URL" ] && [ -z "$DB_HOST" ]; then
            echo "❌ ERROR: No se han configurado los secretos NEON_DATABASE_URL o DB_HOST en GitHub Secrets."
            echo "Por favor diríjase a Settings > Secrets and variables > Actions y agregue sus credenciales."
            exit 1
          fi
          echo "✅ Secretos de base de datos detectados correctamente."

      - name: Ejecutar Pipeline ELT (Extracción y Carga Idempotente)
        run: |
          MODE="${{ github.event.inputs.mode || 'incremental' }}"
          echo "Ejecutando pipeline en modo: $MODE"
          python scripts/run_pipeline.py --mode "$MODE" --no-dbt

      - name: Ejecutar Transformaciones y Pruebas con dbt Core
        if: ${{ !(github.event.inputs.skip_dbt == true) }}
        run: |
          echo "Iniciando dbt build en base de datos Neon..."
          dbt build --project-dir dbt_project --profiles-dir dbt_project

      - name: Publicar estado final
        if: always()
        run: |
          echo "Pipeline ejecutado. Revise los registros anteriores para métricas de filas procesadas."
